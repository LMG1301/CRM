<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Boost CRM — Parametres</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      max-width: 480px;
      margin: 40px auto;
      padding: 24px;
      background: #0f1f1c;
      color: #f0f4f3;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
    }
    h1 { font-size: 20px; margin-bottom: 24px; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 12px; color: #8fa8a2; margin-bottom: 4px; }
    .field input {
      width: 100%; padding: 8px 10px;
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
      border-radius: 6px; color: #f0f4f3; font-size: 14px; outline: none;
    }
    .field input:focus { border-color: #1863DC; }
    .btn {
      padding: 10px 24px; background: #1863DC; color: white;
      border: none; border-radius: 6px; cursor: pointer; font-size: 14px;
    }
    .btn:hover { background: #1454b8; }
    .status { margin-top: 12px; color: #22c55e; display: none; }
  </style>
</head>
<body>
  <h1>&#9889; Boost CRM — Parametres</h1>

  <div class="field">
    <label>URL du CRM</label>
    <input type="text" id="crmUrl" placeholder="https://boost-crm-six.vercel.app">
  </div>
  <div class="field">
    <label>Mot de passe CRM</label>
    <input type="password" id="crmPassword" placeholder="Votre mot de passe">
  </div>

  <button class="btn" id="save">Sauvegarder</button>
  <div class="status" id="status">Parametres sauvegardes &#10003;</div>

  <script src="options.js"></script>
</body>
</html>
