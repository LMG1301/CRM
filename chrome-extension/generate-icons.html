<!DOCTYPE html>
<html>
<body>
<p>Right-click each image and "Save image as" to get the icon PNGs:</p>
<canvas id="c16" width="16" height="16"></canvas> icon16.png<br>
<canvas id="c48" width="48" height="48"></canvas> icon48.png<br>
<canvas id="c128" width="128" height="128"></canvas> icon128.png<br>
<script>
function drawIcon(canvas) {
  const ctx = canvas.getContext('2d');
  const s = canvas.width;
  // Background circle
  ctx.fillStyle = '#1a2e2a';
  ctx.beginPath();
  ctx.arc(s/2, s/2, s/2, 0, Math.PI * 2);
  ctx.fill();
  // Lightning bolt
  ctx.fillStyle = '#4ade80';
  ctx.beginPath();
  const scale = s / 24;
  ctx.moveTo(13*scale, 2*scale);
  ctx.lineTo(3*scale, 14*scale);
  ctx.lineTo(12*scale, 14*scale);
  ctx.lineTo(11*scale, 22*scale);
  ctx.lineTo(21*scale, 10*scale);
  ctx.lineTo(12*scale, 10*scale);
  ctx.closePath();
  ctx.fill();
}
drawIcon(document.getElementById('c16'));
drawIcon(document.getElementById('c48'));
drawIcon(document.getElementById('c128'));
</script>
</body>
</html>
