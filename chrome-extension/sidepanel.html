<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a2e2a;
      color: #e8f0ee;
      font-size: 13px;
      min-height: 100vh;
    }

    .header {
      background: #243d37;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #2d4f46;
    }
    .header svg { flex-shrink: 0; }
    .header h1 { font-size: 14px; font-weight: 600; }
    .header .badge {
      margin-left: auto;
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 10px;
      background: #14532d;
      color: #4ade80;
    }

    .section {
      padding: 12px 16px;
      border-bottom: 1px solid #2d4f46;
    }
    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #8aad9e;
      margin-bottom: 8px;
    }

    .card {
      background: #243d37;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 8px;
    }
    .card-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .card-row:last-child { margin-bottom: 0; }
    .card-label {
      font-size: 11px;
      color: #8aad9e;
    }
    .card-value {
      font-size: 13px;
      color: #e8f0ee;
      text-align: right;
    }

    .stage-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
    }
    .stage-ciblage { background: #1e3a5f; color: #93c5fd; }
    .stage-touch_1, .stage-touch_2, .stage-touch_3 { background: #3b0764; color: #d8b4fe; }
    .stage-nurturing { background: #451a03; color: #fbbf24; }
    .stage-repondu { background: #14532d; color: #4ade80; }
    .stage-call_decouverte { background: #14532d; color: #4ade80; }
    .stage-devis { background: #7c2d12; color: #fdba74; }
    .stage-client { background: #14532d; color: #4ade80; }
    .stage-refuse { background: #450a0a; color: #fca5a5; }
    .stage-bounced { background: #450a0a; color: #fca5a5; }

    /* Form */
    .field {
      margin-bottom: 8px;
    }
    .field label {
      display: block;
      font-size: 11px;
      color: #8aad9e;
      margin-bottom: 3px;
    }
    .field input, .field select {
      width: 100%;
      padding: 7px 10px;
      background: #14231f;
      border: 1px solid #2d4f46;
      border-radius: 6px;
      color: #e8f0ee;
      font-size: 13px;
      outline: none;
    }
    .field input:focus, .field select:focus {
      border-color: #4ade80;
    }
    .field input::placeholder {
      color: #5a7d72;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-primary {
      background: #4ade80;
      color: #14231f;
    }
    .btn-primary:hover { background: #22c55e; }
    .btn-primary:disabled {
      background: #2d4f46;
      color: #5a7d72;
      cursor: not-allowed;
    }
    .btn-link {
      background: transparent;
      color: #4ade80;
      text-decoration: underline;
      font-size: 12px;
      font-weight: 500;
      margin-top: 8px;
    }
    .btn-link:hover { color: #22c55e; }

    .status {
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      margin-top: 8px;
      display: none;
    }
    .status.success {
      display: block;
      background: #14532d;
      color: #4ade80;
      border: 1px solid #166534;
    }
    .status.error {
      display: block;
      background: #450a0a;
      color: #fca5a5;
      border: 1px solid #7f1d1d;
    }
    .status.warning {
      display: block;
      background: #451a03;
      color: #fbbf24;
      border: 1px solid #78350f;
    }

    .empty-state {
      text-align: center;
      padding: 40px 16px;
      color: #5a7d72;
    }
    .empty-state svg {
      margin-bottom: 12px;
      opacity: 0.6;
    }

    .activity-item {
      font-size: 12px;
      line-height: 1.5;
      color: #8aad9e;
    }
    .activity-item strong {
      color: #e8f0ee;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid #14231f;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #loading-view {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      gap: 8px;
      color: #8aad9e;
    }
  </style>
</head>
<body>
  <div class="header">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2">
      <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
    </svg>
    <h1>Boost CRM</h1>
    <span class="badge">Gmail</span>
  </div>

  <!-- Loading state -->
  <div id="loading-view">
    <span class="spinner"></span> Recherche du contact...
  </div>

  <!-- Empty state — no email open -->
  <div id="empty-view" style="display:none;">
    <div class="empty-state">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#5a7d72" stroke-width="1.5">
        <path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
      </svg>
      <p>Ouvre un email pour voir<br>la fiche du contact.</p>
    </div>
  </div>

  <!-- Mode A: Existing prospect -->
  <div id="existing-view" style="display:none;">
    <div class="section">
      <div class="section-title">Contact CRM</div>
      <div class="card">
        <div class="card-row">
          <span id="ex-name" style="font-size:15px; font-weight:600;"></span>
          <span id="ex-stage" class="stage-badge"></span>
        </div>
        <div class="card-row">
          <span class="card-label">Entreprise</span>
          <span class="card-value" id="ex-entreprise"></span>
        </div>
        <div class="card-row">
          <span class="card-label">Fonction</span>
          <span class="card-value" id="ex-fonction"></span>
        </div>
        <div class="card-row">
          <span class="card-label">Email</span>
          <span class="card-value" id="ex-email"></span>
        </div>
        <div class="card-row">
          <span class="card-label">Telephone</span>
          <span class="card-value" id="ex-telephone"></span>
        </div>
        <div class="card-row">
          <span class="card-label">Localisation</span>
          <span class="card-value" id="ex-localisation"></span>
        </div>
      </div>
    </div>

    <div class="section" id="ex-activity-section" style="display:none;">
      <div class="section-title">Derniere activite</div>
      <div class="activity-item" id="ex-activity"></div>
    </div>

    <div class="section" id="ex-action-section" style="display:none;">
      <div class="section-title">Prochaine action</div>
      <div class="activity-item" id="ex-next-action"></div>
    </div>

    <div class="section">
      <button id="btn-open-crm" class="btn btn-primary" onclick="">
        Ouvrir dans le CRM
      </button>
    </div>
  </div>

  <!-- Mode B: New prospect form -->
  <div id="new-view" style="display:none;">
    <div class="section">
      <div class="section-title">Nouveau contact</div>
      <div class="row">
        <div class="field">
          <label>Prenom</label>
          <input id="n-prenom" placeholder="Jean">
        </div>
        <div class="field">
          <label>Nom</label>
          <input id="n-nom" placeholder="Dupont">
        </div>
      </div>
      <div class="field">
        <label>Email</label>
        <input id="n-email" type="email" placeholder="jean@exemple.com">
      </div>
      <div class="field">
        <label>Entreprise</label>
        <input id="n-entreprise" placeholder="Acme Inc.">
      </div>
      <div class="field">
        <label>Fonction</label>
        <input id="n-fonction" placeholder="Directeur commercial">
      </div>
      <div class="row">
        <div class="field">
          <label>Telephone</label>
          <input id="n-telephone" type="tel" placeholder="+33 6 ...">
        </div>
        <div class="field">
          <label>Site web</label>
          <input id="n-site_web" placeholder="https://...">
        </div>
      </div>
      <div class="field">
        <label>Localisation</label>
        <input id="n-localisation" placeholder="Paris, France">
      </div>

      <button id="btn-create" class="btn btn-primary">
        Creer ce prospect
      </button>
      <div id="create-status" class="status"></div>
    </div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
