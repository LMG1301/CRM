<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0d1f1c;
    color: #f0f4f3;
    font-size: 13px;
    padding: 16px;
    min-height: 100vh;
  }
  .header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 16px; padding-bottom: 12px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  .header h1 { font-size: 16px; font-weight: 600; }
  .field { margin-bottom: 10px; }
  .field label { display: block; font-size: 11px; color: #8fa8a2; margin-bottom: 4px; font-weight: 500; }
  .field input, .field select, .field textarea {
    width: 100%; padding: 7px 10px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 6px; color: #f0f4f3; font-size: 13px;
    font-family: inherit; outline: none;
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    border-color: #1863DC;
  }
  .field input::placeholder, .field textarea::placeholder { color: #555; }
  .field textarea { resize: vertical; height: 60px; }
  .field select option { background: #132926; color: #f0f4f3; }
  .btn {
    width: 100%; padding: 9px; border-radius: 6px;
    border: none; cursor: pointer; font-size: 13px;
    font-weight: 500; margin-bottom: 6px; font-family: inherit;
  }
  .btn-primary { background: #1863DC; color: white; }
  .btn-primary:hover { background: #1454b8; }
  .btn-secondary { background: rgba(255,255,255,0.08); color: #f0f4f3; }
  .btn-secondary:hover { background: rgba(255,255,255,0.15); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .section {
    border-top: 1px solid rgba(255,255,255,0.1);
    padding-top: 12px; margin-top: 12px;
  }
  .badge {
    display: inline-block; padding: 2px 10px; border-radius: 4px;
    font-size: 11px; font-weight: 600; margin-top: 4px;
    background: rgba(24,99,220,0.2); color: #60a5fa;
  }
  .note-block {
    background: rgba(255,255,255,0.05); border-radius: 6px;
    padding: 8px; margin: 8px 0; font-size: 12px; line-height: 1.4;
  }
  .note-label { font-size: 10px; color: #8fa8a2; margin-bottom: 2px; font-weight: 600; }
  .status { font-size: 12px; text-align: center; padding: 6px; margin-top: 6px; }
  .status-ok { color: #22c55e; }
  .status-err { color: #ef4444; background: rgba(239,68,68,0.1); border-radius: 6px; }
  .status-wait { color: #fbbf24; }
  .tabs { display: flex; gap: 4px; margin-bottom: 12px; }
  .tab {
    flex: 1; padding: 6px; text-align: center; border-radius: 6px;
    cursor: pointer; font-size: 12px; font-weight: 500;
    background: rgba(255,255,255,0.05); color: #8fa8a2;
    border: none; font-family: inherit;
  }
  .tab.active { background: #1863DC; color: white; }
  .row { display: flex; gap: 6px; }
  .row > .field { flex: 1; }
  .prospect-name { font-size: 15px; font-weight: 600; }
  .prospect-company { color: #8fa8a2; font-size: 12px; margin-top: 2px; }
</style>
</head>
<body>

<div class="header">
  <h1>&#9889; Boost CRM</h1>
  <span id="connection-status" style="font-size:11px;color:#8fa8a2;">...</span>
</div>

<!-- Tabs -->
<div class="tabs">
  <button class="tab active" id="tab-search" onclick="showTab('search')">Rechercher</button>
  <button class="tab" id="tab-reply" onclick="showTab('reply')">Repondre</button>
  <button class="tab" id="tab-add" onclick="showTab('add')">Ajouter</button>
</div>

<!-- TAB: RECHERCHER -->
<div id="panel-search">
  <div class="field">
    <label>Email ou nom du contact</label>
    <div style="display:flex;gap:4px;">
      <input type="text" id="search-input" placeholder="email@entreprise.com ou nom...">
      <button class="btn btn-primary" style="width:auto;padding:7px 14px;" id="search-btn">&#128269;</button>
    </div>
  </div>
  <div id="search-result"></div>
</div>

<!-- TAB: REPONDRE -->
<div id="panel-reply" style="display:none;">
  <div class="field">
    <label>Email du contact</label>
    <input type="text" id="reply-email" placeholder="email@entreprise.com">
  </div>
  <div class="field">
    <label>Coller l'email recu</label>
    <textarea id="reply-body" placeholder="Collez le texte de l'email ici..." style="height:100px;"></textarea>
  </div>
  <div class="field">
    <label>Modele IA</label>
    <select id="reply-model">
      <option value="claude-haiku-4-5-20251001">Haiku (rapide)</option>
      <option value="claude-sonnet-4-20250514" selected>Sonnet (qualite)</option>
    </select>
  </div>
  <button class="btn btn-primary" id="btn-auto-reply">&#129302; Generer automatiquement</button>
  <div class="field" style="margin-top:8px;">
    <label>OU donner une instruction</label>
    <textarea id="reply-instruction" placeholder="Ex: dis-lui qu'on est dispo mardi pour un call..." style="height:40px;"></textarea>
  </div>
  <button class="btn btn-primary" id="btn-instruct-reply">Rediger avec instruction</button>
  <div id="reply-result"></div>
</div>

<!-- TAB: AJOUTER -->
<div id="panel-add" style="display:none;">
  <div class="row">
    <div class="field"><label>Prenom</label><input type="text" id="add-fn"></div>
    <div class="field"><label>Nom</label><input type="text" id="add-ln"></div>
  </div>
  <div class="field"><label>Email</label><input type="text" id="add-email"></div>
  <div class="field"><label>Entreprise</label><input type="text" id="add-company"></div>
  <div class="field"><label>Fonction</label><input type="text" id="add-title"></div>
  <div class="field"><label>LinkedIn</label><input type="text" id="add-linkedin" readonly style="opacity:0.7;"></div>
  <div class="field"><label>Localisation</label><input type="text" id="add-location"></div>
  <div class="field">
    <label>Stage pipeline</label>
    <select id="add-stage">
      <option value="ciblage" selected>Ciblage</option>
      <option value="contacte">Contacte</option>
      <option value="repondu">Repondu</option>
    </select>
  </div>
  <button class="btn btn-primary" id="btn-save-prospect">Enregistrer dans le CRM</button>
  <div id="add-status"></div>
</div>

<script>
// === Config ===
const CRM_URL_KEY = 'crm_url';
const CRM_PASS_KEY = 'crm_password';

async function getCrmUrl() {
  const r = await chrome.storage.local.get(CRM_URL_KEY);
  return r[CRM_URL_KEY] || 'https://boost-crm-six.vercel.app';
}

async function crmFetch(endpoint, options = {}) {
  const url = await getCrmUrl();
  const { crm_password: pass } = await chrome.storage.local.get(CRM_PASS_KEY);
  try {
    const resp = await fetch(url + endpoint, {
      ...options,
      headers: {
        'Content-Type': 'application/json',
        ...(pass ? { 'Authorization': 'Bearer ' + pass } : {}),
        ...(options.headers || {}),
      }
    });
    if (!resp.ok) {
      const body = await resp.json().catch(() => ({}));
      return { error: body.error || 'Erreur ' + resp.status };
    }
    return await resp.json();
  } catch (e) {
    return { error: e.message };
  }
}

function esc(text) {
  if (!text) return '';
  const d = document.createElement('div');
  d.textContent = text;
  return d.innerHTML;
}

// === Tabs ===
function showTab(name) {
  ['search', 'reply', 'add'].forEach(t => {
    document.getElementById('panel-' + t).style.display = t === name ? 'block' : 'none';
    document.getElementById('tab-' + t).classList.toggle('active', t === name);
  });
}

// === Connection check ===
async function checkConnection() {
  const el = document.getElementById('connection-status');
  const r = await crmFetch('/api/health');
  if (r.status === 'ok') {
    el.innerHTML = '<span style="color:#22c55e;">&#9679; Connecte</span>';
  } else {
    el.innerHTML = '<span style="color:#ef4444;">&#9679; Hors ligne</span>';
  }
}
checkConnection();

// === LinkedIn data auto-fill ===
chrome.storage.session.get('linkedinProfile', (data) => {
  if (data.linkedinProfile) {
    const p = data.linkedinProfile;
    const parts = p.name.split(/\s+/);
    document.getElementById('add-fn').value = parts[0] || '';
    document.getElementById('add-ln').value = parts.slice(1).join(' ') || '';
    document.getElementById('add-company').value = p.company || '';
    document.getElementById('add-linkedin').value = p.url || '';
    document.getElementById('add-location').value = p.location || '';
    document.getElementById('search-input').value = p.name || '';
  }
});

// Listen for live updates from LinkedIn scraper
chrome.storage.session.onChanged.addListener((changes) => {
  if (changes.linkedinProfile?.newValue) {
    const p = changes.linkedinProfile.newValue;
    const parts = p.name.split(/\s+/);
    document.getElementById('add-fn').value = parts[0] || '';
    document.getElementById('add-ln').value = parts.slice(1).join(' ') || '';
    document.getElementById('add-company').value = p.company || '';
    document.getElementById('add-linkedin').value = p.url || '';
    document.getElementById('add-location').value = p.location || '';
    document.getElementById('search-input').value = p.name || '';
  }
});

// === SEARCH ===
document.getElementById('search-btn').addEventListener('click', searchContact);
document.getElementById('search-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') searchContact();
});

async function searchContact() {
  const input = document.getElementById('search-input').value.trim();
  if (!input) return;
  const resultEl = document.getElementById('search-result');
  resultEl.innerHTML = '<div class="status status-wait">Recherche...</div>';

  const isEmail = input.includes('@');
  const params = new URLSearchParams();
  if (isEmail) params.set('email', input);
  else params.set('name', input);

  const endpoint = '/api/prospects/by-email?' + params;
  console.log('[Boost] searching:', endpoint);

  let r;
  try {
    r = await crmFetch(endpoint);
    console.log('[Boost] result:', JSON.stringify(r).substring(0, 300));
  } catch (e) {
    console.error('[Boost] fetch error:', e);
    resultEl.innerHTML = '<div class="status status-err">Erreur reseau : ' + esc(e.message) + '</div>';
    return;
  }

  if (r.error) {
    resultEl.innerHTML = '<div class="status status-err">' + esc(r.error) + '</div>';
    return;
  }

  if (r.found) {
    const p = r.prospect;
    const crmUrl = await getCrmUrl();
    resultEl.innerHTML = `
      <div style="margin-top:10px;">
        <div class="prospect-name">${esc(p.prenom)} ${esc(p.nom)}</div>
        <div class="prospect-company">${esc(p.entreprise || '')}</div>
        <span class="badge">${esc(p.pipeline_stage_label || p.pipeline_stage)}</span>
        ${p.derniere_note ? `<div class="note-block"><div class="note-label">Derniere note</div>${esc(p.derniere_note.substring(0, 200))}</div>` : ''}
        ${p.prochaine_action_desc ? `<div class="note-block"><div class="note-label">Prochaine action</div>${esc(p.prochaine_action_desc)}</div>` : ''}
        <div class="section">
          <button class="btn btn-secondary" id="sr-reply">&#129302; Repondre a un email</button>
          <button class="btn btn-secondary" id="sr-open">&#128194; Ouvrir dans le CRM</button>
        </div>
      </div>
    `;
    document.getElementById('sr-reply').addEventListener('click', () => {
      showTab('reply');
      document.getElementById('reply-email').value = p.email || input;
      document.getElementById('reply-email').dataset.prospectId = p.id;
    });
    document.getElementById('sr-open').addEventListener('click', () => {
      window.open(crmUrl + '/prospects/' + p.id, '_blank');
    });
  } else {
    resultEl.innerHTML = `
      <div style="margin-top:10px; text-align:center;">
        <div style="color:#8fa8a2; margin-bottom:8px;">Contact non trouve dans le CRM.</div>
        <button class="btn btn-secondary" id="sr-add">+ Ajouter au CRM</button>
      </div>
    `;
    document.getElementById('sr-add').addEventListener('click', () => {
      showTab('add');
      if (isEmail) {
        document.getElementById('add-email').value = input;
      } else {
        const words = input.split(/\s+/);
        document.getElementById('add-fn').value = words[0] || '';
        document.getElementById('add-ln').value = words.slice(1).join(' ') || '';
      }
    });
  }
}

// === REPLY ===
document.getElementById('btn-auto-reply').addEventListener('click', () => doGenerate(null));
document.getElementById('btn-instruct-reply').addEventListener('click', () => {
  const instr = document.getElementById('reply-instruction').value.trim();
  if (instr) doGenerate(instr);
});
document.getElementById('reply-instruction').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    const instr = document.getElementById('reply-instruction').value.trim();
    if (instr) doGenerate(instr);
  }
});

async function doGenerate(instruction) {
  const resultEl = document.getElementById('reply-result');
  resultEl.innerHTML = '<div class="status status-wait">&#9203; Generation en cours...</div>';

  const email = document.getElementById('reply-email').value.trim();
  const body = document.getElementById('reply-body').value;
  const model = document.getElementById('reply-model').value;
  const prospectId = document.getElementById('reply-email').dataset.prospectId || null;

  const r = await crmFetch('/api/gmail-plugin/generate-reply', {
    method: 'POST',
    body: JSON.stringify({
      prospect_id: prospectId,
      prospect_email: email,
      email_subject: '',
      email_body: body,
      instruction: instruction,
      model: model,
    })
  });

  if (r.error) {
    resultEl.innerHTML = '<div class="status status-err">' + esc(r.error) + '</div>';
    return;
  }

  resultEl.innerHTML = `
    <div style="margin-top:10px;">
      <textarea id="reply-text" style="width:100%;padding:10px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:6px;color:#f0f4f3;font-size:13px;height:200px;resize:vertical;font-family:inherit;outline:none;">${esc(r.reply)}</textarea>
      <div style="display:flex;gap:6px;margin-top:6px;">
        <button class="btn btn-primary" id="btn-copy" style="flex:1;">Copier</button>
        <button class="btn btn-secondary" id="btn-regen" style="flex:1;">Regenerer</button>
      </div>
    </div>
  `;

  document.getElementById('btn-copy').addEventListener('click', () => {
    const text = document.getElementById('reply-text').value;
    navigator.clipboard.writeText(text);
    const btn = document.getElementById('btn-copy');
    btn.textContent = 'Copie \u2713';
    setTimeout(() => { btn.textContent = 'Copier'; }, 2000);
  });

  document.getElementById('btn-regen').addEventListener('click', () => doGenerate(instruction));
}

// === ADD PROSPECT ===
document.getElementById('btn-save-prospect').addEventListener('click', saveProspect);

async function saveProspect() {
  const statusEl = document.getElementById('add-status');
  statusEl.innerHTML = '<div class="status status-wait">Enregistrement...</div>';

  const btn = document.getElementById('btn-save-prospect');
  btn.disabled = true;

  const r = await crmFetch('/api/prospects/quick-add', {
    method: 'POST',
    body: JSON.stringify({
      prenom: document.getElementById('add-fn').value.trim(),
      nom: document.getElementById('add-ln').value.trim(),
      email: document.getElementById('add-email').value.trim() || null,
      entreprise: document.getElementById('add-company').value.trim() || null,
      fonction: document.getElementById('add-title').value.trim() || null,
      linkedin_url: document.getElementById('add-linkedin').value.trim() || null,
      localisation: document.getElementById('add-location').value.trim() || null,
      pipeline_stage: document.getElementById('add-stage').value,
      source: 'Extension Chrome',
    })
  });

  btn.disabled = false;

  if (r.error) {
    statusEl.innerHTML = '<div class="status status-err">' + esc(r.error) + '</div>';
  } else if (r.status === 'duplicate') {
    statusEl.innerHTML = '<div class="status status-wait">' + esc(r.message || 'Prospect deja existant') + '</div>';
  } else {
    statusEl.innerHTML = '<div class="status status-ok">Enregistre &#10003;</div>';
    btn.textContent = 'Enregistre \u2713';
    btn.style.background = '#22c55e';
    setTimeout(() => {
      btn.textContent = 'Enregistrer dans le CRM';
      btn.style.background = '';
    }, 3000);
  }
}
</script>
</body>
</html>
