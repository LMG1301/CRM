<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0d1f1c;
    color: #f0f4f3;
    font-size: 13px;
    padding: 16px;
    min-height: 100vh;
  }
  .header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 16px; padding-bottom: 12px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  .header h1 { font-size: 16px; font-weight: 600; }
  .field { margin-bottom: 10px; }
  .field label { display: block; font-size: 11px; color: #8fa8a2; margin-bottom: 4px; font-weight: 500; }
  .field input, .field select, .field textarea {
    width: 100%; padding: 7px 10px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 6px; color: #f0f4f3; font-size: 13px;
    font-family: inherit; outline: none;
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    border-color: #1863DC;
  }
  .field input::placeholder, .field textarea::placeholder { color: #555; }
  .field textarea { resize: vertical; height: 60px; }
  .field select option { background: #132926; color: #f0f4f3; }
  .btn {
    width: 100%; padding: 9px; border-radius: 6px;
    border: none; cursor: pointer; font-size: 13px;
    font-weight: 500; margin-bottom: 6px; font-family: inherit;
  }
  .btn-primary { background: #1863DC; color: white; }
  .btn-primary:hover { background: #1454b8; }
  .btn-secondary { background: rgba(255,255,255,0.08); color: #f0f4f3; }
  .btn-secondary:hover { background: rgba(255,255,255,0.15); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .section {
    border-top: 1px solid rgba(255,255,255,0.1);
    padding-top: 12px; margin-top: 12px;
  }
  .badge {
    display: inline-block; padding: 2px 10px; border-radius: 4px;
    font-size: 11px; font-weight: 600; margin-top: 4px;
    background: rgba(24,99,220,0.2); color: #60a5fa;
  }
  .note-block {
    background: rgba(255,255,255,0.05); border-radius: 6px;
    padding: 8px; margin: 8px 0; font-size: 12px; line-height: 1.4;
  }
  .note-label { font-size: 10px; color: #8fa8a2; margin-bottom: 2px; font-weight: 600; }
  .status { font-size: 12px; text-align: center; padding: 6px; margin-top: 6px; }
  .status-ok { color: #22c55e; }
  .status-err { color: #ef4444; background: rgba(239,68,68,0.1); border-radius: 6px; }
  .status-wait { color: #fbbf24; }
  .tabs { display: flex; gap: 4px; margin-bottom: 12px; }
  .tab {
    flex: 1; padding: 6px; text-align: center; border-radius: 6px;
    cursor: pointer; font-size: 12px; font-weight: 500;
    background: rgba(255,255,255,0.05); color: #8fa8a2;
    border: none; font-family: inherit;
  }
  .tab.active { background: #1863DC; color: white; }
  .row { display: flex; gap: 6px; }
  .row > .field { flex: 1; }
  .prospect-name { font-size: 15px; font-weight: 600; }
  .prospect-company { color: #8fa8a2; font-size: 12px; margin-top: 2px; }
</style>
</head>
<body>

<div class="header">
  <h1>&#9889; Boost CRM</h1>
  <span id="connection-status" style="font-size:11px;color:#8fa8a2;">...</span>
</div>

<!-- Tabs -->
<div class="tabs">
  <button class="tab active" id="tab-search">Rechercher</button>
  <button class="tab" id="tab-reply">Repondre</button>
  <button class="tab" id="tab-add">Ajouter</button>
</div>

<!-- TAB: RECHERCHER -->
<div id="panel-search">
  <div class="field">
    <label>Email ou nom du contact</label>
    <div style="display:flex;gap:4px;">
      <input type="text" id="search-input" placeholder="email@entreprise.com ou nom...">
      <button class="btn btn-primary" style="width:auto;padding:7px 14px;" id="search-btn">&#128269;</button>
    </div>
  </div>
  <div id="search-result"></div>
</div>

<!-- TAB: REPONDRE -->
<div id="panel-reply" style="display:none;">
  <div class="field">
    <label>Email du contact</label>
    <input type="text" id="reply-email" placeholder="email@entreprise.com">
  </div>
  <div class="field">
    <label>Coller l'email recu</label>
    <textarea id="reply-body" placeholder="Collez le texte de l'email ici..." style="height:100px;"></textarea>
  </div>
  <div class="field">
    <label>Modele IA</label>
    <select id="reply-model">
      <option value="claude-haiku-4-5-20251001">Haiku (rapide)</option>
      <option value="claude-sonnet-4-20250514" selected>Sonnet (qualite)</option>
    </select>
  </div>
  <button class="btn btn-primary" id="btn-auto-reply">&#129302; Generer automatiquement</button>
  <div class="field" style="margin-top:8px;">
    <label>OU donner une instruction</label>
    <textarea id="reply-instruction" placeholder="Ex: dis-lui qu'on est dispo mardi pour un call..." style="height:40px;"></textarea>
  </div>
  <button class="btn btn-primary" id="btn-instruct-reply">Rediger avec instruction</button>
  <div id="reply-result"></div>
</div>

<!-- TAB: AJOUTER -->
<div id="panel-add" style="display:none;">
  <div class="row">
    <div class="field"><label>Prenom</label><input type="text" id="add-fn"></div>
    <div class="field"><label>Nom</label><input type="text" id="add-ln"></div>
  </div>
  <div class="field"><label>Email</label><input type="text" id="add-email"></div>
  <div class="field"><label>Entreprise</label><input type="text" id="add-company"></div>
  <div class="field"><label>Fonction</label><input type="text" id="add-title"></div>
  <div class="field"><label>LinkedIn</label><input type="text" id="add-linkedin" placeholder="https://linkedin.com/in/..."></div>
  <div class="field"><label>Localisation</label><input type="text" id="add-location"></div>
  <div class="field">
    <label>Stage pipeline</label>
    <select id="add-stage">
      <option value="ciblage" selected>Ciblage</option>
      <option value="contacte">Contacte</option>
      <option value="repondu">Repondu</option>
    </select>
  </div>
  <button class="btn btn-primary" id="btn-save-prospect">Enregistrer dans le CRM</button>
  <div id="add-status"></div>
</div>

<script src="sidepanel.js"></script>
</body>
</html>
