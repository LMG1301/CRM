<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 280px;
      padding: 16px;
      background: #132926;
      color: #f0f4f3;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .header-logo { font-size: 20px; }
    .header-title { font-size: 16px; font-weight: 600; }

    .subtitle {
      font-size: 12px;
      color: #8fa8a2;
      margin-bottom: 12px;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 12px;
      font-size: 12px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .status-dot.connected { background: #22c55e; }
    .status-dot.disconnected { background: #ef4444; }

    .field {
      margin-bottom: 10px;
    }
    .field label {
      display: block;
      font-size: 11px;
      color: #8fa8a2;
      margin-bottom: 4px;
    }
    .field input {
      width: 100%;
      padding: 6px 8px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 4px;
      color: #f0f4f3;
      font-size: 12px;
      outline: none;
      box-sizing: border-box;
    }
    .field input:focus { border-color: #1863DC; }

    .btn {
      width: 100%;
      padding: 8px;
      background: #1863DC;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
    }
    .btn:hover { background: #1454b8; }

    .footer {
      margin-top: 12px;
      font-size: 11px;
      color: #5a7d72;
      text-align: center;
      line-height: 1.5;
    }

    .save-feedback {
      font-size: 12px;
      color: #22c55e;
      text-align: center;
      margin-top: 6px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="header-logo">&#9889;</span>
    <span class="header-title">Boost CRM</span>
  </div>

  <div class="subtitle">Extension active sur LinkedIn et Gmail</div>

  <div class="status-row">
    <span class="status-dot" id="status-dot"></span>
    <span id="status-text">Connexion...</span>
  </div>

  <div class="field">
    <label>URL du CRM</label>
    <input type="text" id="crmUrl" placeholder="http://localhost:3000">
  </div>

  <div class="field">
    <label>Mot de passe CRM</label>
    <input type="password" id="crmPassword" placeholder="Votre mot de passe">
  </div>

  <button class="btn" id="save">Sauvegarder</button>
  <div class="save-feedback" id="save-feedback">Sauvegarde &#10003;</div>

  <div class="footer">
    LinkedIn : capture de prospects<br>
    Gmail : reponse IA avec contexte CRM
  </div>

  <script src="popup.js"></script>
</body>
</html>
